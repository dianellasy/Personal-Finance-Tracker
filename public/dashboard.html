<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top banner -->
    <header class="top-banner">
        <h1>Personal Finance Tracker</h1>
    </header>

    <div class="content">
        <div class="dashboard-container">

            <!-- Summary Card -->
            <div class="summary-card">
                <h2>Total Spent This Month</h2>
                <p id="monthlyTotal">$0</p>
            </div>

            <!-- Dashboard header -->
            <header class="dashboard-header">
                <h1>Your Transactions</h1>
                <button id="logoutButton">Logout</button>
            </header>

            <!-- Main dashboard -->
            <main class="dashboard-main">

                <!-- Left panel: Add Transaction -->
                <section class="add-transaction-panel">
                    <h2 class="section-title">Add Transaction</h2>

                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount">

                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="date">Date</label>
                    <input type="date" id="date">

                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" placeholder="Notes">

                    <button id="addTransactionButton">Add Transaction</button>

                    <p id="addError"></p>
                    <p id="addSuccess"></p>
                </section>

                <!-- Right panel: History -->
                <section class="transactions-panel">
                    <h2 class="section-title">Your History</h2>

                    <label for="sortSelect">Sort By</label>
                    <select id="sortSelect">
                        <option value="date-newest-first">Newest First</option>
                        <option value="date-oldest-first">Oldest First</option>
                        <option value="highest-amount">Highest Amount</option>
                        <option value="lowest-amount">Lowest Amount</option>
                    </select>

                    <label for="filterSelect">Filter By Category</label>
                    <select id="filterSelect">
                        <option value="all">All</option>
                        <option value="Food">Food</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>

                    <ul id="transactionList" class="transaction-list"></ul>
                </section>
            </main>

            <section id="editTransactionSection" style="display:none; margin-top:20px;">
                <h2 class="section-title">Edit Transaction</h2>
                <div id="editTransactionBox"></div>
            </section>

            <section id="calendarSection">
                <h2 class="section-title">Calendar View</h2>

                <div id="calendarHeader">
                    <button id="previousMonthButton">◀</button>
                    <span id="calendarMonthLabel"></span>
                    <button id="nextMonthButton">▶</button>
                </div>

                <div class="calendar-weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <div id="calendarGrid" class="calendar-grid"></div>

                <div id="calendarDayDetails"></div>
            </section>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        © 2026 Dianella Sy — Designed & Built with Care
    </footer>

    <script src="app.js"></script>
</body>
</html>
