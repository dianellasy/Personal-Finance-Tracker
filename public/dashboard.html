<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top banner -->
    <header class="top-banner">
        <h1>Personal Finance Tracker</h1>
    </header>

    <div class="content">
        <div class="dashboard-container">

            <!-- Dashboard header -->
            <header class="dashboard-header">
                <h1>Your Transactions</h1>
                <button id="logoutButton">Logout</button>
            </header>

            <!-- Main dashboard -->
            <main class="dashboard-main">

                <!-- Left panel: Add Transaction -->
                <section class="add-transaction-panel">
                    <h2 class="section-title">Add Transaction</h2>

                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount">

                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="date">Date</label>
                    <input type="date" id="date">

                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" placeholder="Notes">

                    <button id="addTransactionButton">Add Transaction</button>

                    <!-- Error + Success -->
                    <p id="addError"></p>
                    <p id="addSuccess"></p>
                </section>

                <!-- Right panel: History -->
                <section class="transactions-panel">
                    <h2 class="section-title">Your History</h2>

                    <label for="sortSelect">Sort By</label>
                    <select id="sortSelect">
                        <option value="date-newest-first">Newest First</option>
                        <option value="date-oldest-first">Oldest First</option>
                        <option value="highest-amount">Highest Amount</option>
                        <option value="lowest-amount">Lowest Amount</option>
                    </select>

                    <label for="filterSelect">Filter By Category</label>
                    <select id="filterSelect">
                        <option value="all">All</option>
                        <option value="Food">Food</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>

                    <ul id="transactionList" class="transaction-list"></ul>
                </section>

            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        © 2026 Dianella Sy — All Rights Reserved
    </footer>

    <script src="app.js"></script>
</body>
</html>
