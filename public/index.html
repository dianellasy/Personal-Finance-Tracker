<!-- Login page for returning users -->
<!-- User enters username & password and receives a token on success -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <!-- Top banner -->
        <header class="top-banner">
            <h1>Personal Finance Tracker</h1>
        </header>

        <div class="content">
            <!-- Login container: holds the login form centered on the page -->
            <div class="login-container">
                <h1>Login</h1>

                <!-- Username input -->
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                >

                <!-- Password input -->
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

                <!-- Login button -->
                <button id="loginButton">Login</button>

                <!-- Link to signup page -->
                <p>
                    Don't have an account?
                    <a href="signup.html">Sign up here</a>
                </p>

                <!-- Error message area -->
                <p id="loginError"></p>
            </div>
        </div>
        
         <!-- Footer -->
         <footer class="footer">
            © 2026 Dianella Sy — All Rights Reserved
         </footer>

         <script src="app.js"></script>
    </body>
</html>
