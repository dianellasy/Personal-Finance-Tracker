<!-- Main dashboard shown only after login -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <!-- Dashboard header -->
        <header class="dashboard-header">
            <h1>Your Transactions</h1>
            <button id="logoutButton">Logout</button>
        </header>

        <!-- Main dashboard -->
        <main class="dashboard-main">
            <!-- Left panel: add new transaction -->
            <section class="add-transaction-panel">
                <h2>Add Transaction</h2>

                <!-- Amount -->
                <label for="amount">Amount</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                >

                <!-- Category -->
                <label for="category">Catgeory</label>
                <select id="category">
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Bills">Bills</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <!-- Date -->
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                >

                <!-- Description -->
                <label for="description">Description (optional)</label>
                <input
                    type="text"
                    id="description"
                    placeholder="Notes"
                >

                <!-- Add button -->
                <button id="addTransactionButton">Add Transaction</button>

                <!-- Error message area -->
                <p id="addError" class="error-message"></p>
            </section>

            <!-- Right panel: transaction list + sorting + filtering -->
            <section class="transactions-panel">
                <h2>Your History</h2>

                <!-- Sorting -->
                <label for="sortSelect">Sort By</label>
                <select id="sortSelect">
                    <option value="date-newest-first">Newest First</option>
                    <option value="date-oldest-first">Oldest First</option>
                    <option value="highest-amount">Highest Amount</option>
                    <option value="lowest-amount">Lowest Amount</option>
                </select>

                <!-- Filtering -->
                <label for="filterSelect">Filter By Category</label>
                <select id="filterSelect">
                    <option value="all">All</option>
                    <option value="Food">Food</option>
                    <option value="Bills">Bills</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <!-- Transaction list container -->
                <ul id="transactionList" class="transaction-list">
                </ul>
            </section>

            <section id="calendarSection" style="display:none;">
                <h2>Monthly Calendar</h2>

                <!-- Month header -->
                <div id="calendarHeader">
                    <button id="previousMonthButton">◀</button>
                    <span id="calendarMonthLabel"></span>
                    <button id="nextMonthButton">▶</button>
                </div>

                <!-- Calendar grid -->
                <div id="calendarGrid" class="calendar-grid"></div>

                <!-- Day details -->
                <div id="calendarDayDetails"></div>
            </section>

            <!-- Button to switch views -->
            <button id="calendarViewButton">Calendar View</button>
            <button id="listViewButton" style="display:none;">List View</button>
        </main>
        <script src="app.js"></script>
    </body>
</html>
